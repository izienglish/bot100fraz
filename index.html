<style>
  :root {
    --navy: #1A2B5F;
    --red: #C0392B;
    --gold: #F0C040;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--navy) 0%, #0f1b3d 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #fff;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-weight: 800;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
    letter-spacing: 0.02em;
  }
  h1 {
    font-size: 26px;
    line-height: 1.3;
    margin: 0 0 12px;
  }
  p.sub {
    color: #cfd6ea;
    font-size: 15px;
    margin: 0 0 28px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--red);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 17px;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(192,57,43,0.4);
  }
  .hint {
    margin-top: 22px;
    font-size: 14px;
    color: var(--gold);
    line-height: 1.6;
  }

  .corner-arrow {
    position: fixed;
    top: 14px;
    right: 16px;
    width: 90px;
    height: 160px;
    pointer-events: none;
    z-index: 10;
    overflow: visible;
    animation: nudge 1.2s ease-in-out infinite;
  }
  .corner-arrow path {
    fill: none;
    stroke: var(--red);
    stroke-width: 6;
    stroke-linecap: round;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
  }
  @keyframes nudge {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
</style>
</head>
<body>
  <svg class="corner-arrow" viewBox="0 0 90 160" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
        <polygon points="0,0 8,4 0,8" fill="#C0392B" />
      </marker>
    </defs>
    <path d="M40,150 Q12,72 66,22" marker-end="url(#arrowhead)" />
  </svg>

  <div class="card">
    <span class="badge">EASY-PEASY</span>
    <h1>100 самых нужных английских фраз — бесплатно 🎉</h1>
    <p class="sub">Нажми кнопку ниже, чтобы открыть бота в Telegram и получить файл</p>
    <a class="btn" id="openBtn" href="tg://resolve?domain=EasyPeasyPdfBot">Открыть в Telegram</a>
    <div class="hint">
      Если не открылось — нажми <b>⋯</b> вверху экрана (см. стрелку)<br>и выбери «Открыть в браузере»
    </div>
  </div>

  <script>
    window.location.href = "tg://resolve?domain=EasyPeasyPdfBot";
    document.getElementById('openBtn').addEventListener('click', function (e) {
      setTimeout(function () {
        window.location.href = "https://t.me/EasyPeasyPdfBot";
      }, 800);
    });
  </script>
</body>
</html>
