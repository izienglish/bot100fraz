<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Peasy | Учим Английский</title>

<!-- Мета-теги, из-за которых TikTok/соцсети показывают карточку "как у Telegram" -->
<meta property="al:android:app_name" content="Telegram">
<meta property="al:android:package" content="org.telegram.messenger">
<meta property="al:android:url" content="tg://resolve?domain=EasyPeasyPdfBot">
<meta property="al:ios:app_name" content="Telegram Messenger">
<meta property="al:ios:app_store_id" content="686449807">
<meta property="al:ios:url" content="tg://resolve?domain=EasyPeasyPdfBot">
<meta name="apple-itunes-app" content="app-id=686449807, app-argument=tg://resolve?domain=EasyPeasyPdfBot">
<meta property="og:site_name" content="Telegram">
<meta property="og:title" content="Easy Peasy | Учим Английский">
<meta property="og:description" content="Получи бесплатный файл «100 самых нужных английских фраз» 🎉 Нажми, чтобы открыть в Telegram!">
<meta property="twitter:card" content="summary">
<meta property="twitter:title" content="Easy Peasy | Учим Английский">
<meta property="twitter:description" content="Получи бесплатный файл «100 самых нужных английских фраз» 🎉">

<style>
  :root {
    --navy: #1A2B5F;
    --red: #C0392B;
    --gold: #F0C040;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--navy) 0%, #0f1b3d 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #fff;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-weight: 800;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
    letter-spacing: 0.02em;
  }
  h1 {
    font-size: 26px;
    line-height: 1.3;
    margin: 0 0 12px;
  }
  p.sub {
    color: #cfd6ea;
    font-size: 15px;
    margin: 0 0 28px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--red);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 17px;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(192,57,43,0.4);
  }
  .hint {
    margin-top: 22px;
    font-size: 14px;
    color: var(--gold);
    line-height: 1.6;
  }
  .arrow {
    font-size: 22px;
    display: inline-block;
    animation: bounce 1.4s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(6px); }
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">EASY-PEASY</span>
    <h1>100 самых нужных английских фраз — бесплатно 🎉</h1>
    <p class="sub">Нажми кнопку ниже, чтобы открыть бота в Telegram и получить файл</p>
    <a class="btn" id="openBtn" href="tg://resolve?domain=EasyPeasyPdfBot">Открыть в Telegram</a>
    <div class="hint">
      <span class="arrow">⬆️</span><br>
      Если не открылось — нажми ⋯ вверху экрана<br>и выбери «Открыть в браузере»
    </div>
  </div>

  <script>
    // Пытаемся открыть Telegram автоматически сразу при загрузке страницы
    window.location.href = "tg://resolve?domain=EasyPeasyPdfBot";

    // Если через секунду страница ещё открыта (приложение не открылось) —
    // подстраховываемся обычной t.me ссылкой при клике на кнопку
    document.getElementById('openBtn').addEventListener('click', function (e) {
      setTimeout(function () {
        window.location.href = "https://t.me/EasyPeasyPdfBot";
      }, 800);
    });
  </script>
</body>
</html>
